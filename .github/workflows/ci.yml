name: MeGa X Ecosystem CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  daemon-test-matrix:
    name: Daemon Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    defaults:
      run:
        working-directory: ./daemon

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git Identity for Tests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./daemon/package-lock.json

      - name: Install Daemon Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Build Daemon
        run: npm run build

      - name: Run Full Test Battery (All Suites)
        run: npm test

      - name: Validate Ecosystem Health CLI
        run: npx megax health

      - name: Validate Docker Configuration
        run: npx megax docker

  mobile-ci:
    name: Mobile Flutter Analysis & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Flutter Static Analysis
        run: flutter analyze

      - name: Run Mobile Flutter Test Suite
        run: flutter test
